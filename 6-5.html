<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }
      .container {
        padding: 2%;
      }
      .feature-box {
        background-color: #ddd;
        padding: 20px;
        text-align: center;
        border-radius: 5px;
        width: 32%;
        display: inline-block;
        margin: 0.5%;
      }
    </style>
  </head>
  <body>
    <!-- Thanh điều hướng -->
    <div
      style="
        background-color: #4caf50;
        color: white;
        padding: 15px;

        display: flex;
        justify-content: space-between;
        align-items: center;
      "
    >
      <h1 style="margin: 0; padding-left: 20px">My Website</h1>
      <div style="display: flex; gap: 20px; padding-right: 20px">
        <a href="" style="color: white; text-decoration: none">Home</a>
        <a href="" style="color: white; text-decoration: none">About</a>
        <a href="" style="color: white; text-decoration: none">Services</a>
        <a href="" style="color: white; text-decoration: none">Contact</a>
      </div>
    </div>

    <!-- Phần giới thiệu -->
    <div style="text-align: center; padding: 80px; background-color: #f5f5f5">
      <h2>Welcome to My Website</h2>
      <p style="padding: 12px">
        We provide the best solutions for your business.
      </p>
      <button
        style="
          background-color: #4caf50;
          color: white;
          padding: 10px 20px;
          font-size: 16px;
          border: none;
          cursor: pointer;
          border-radius: 5px;
          margin-top: 10px;
        "
      >
        Get Started
      </button>
    </div>

    <!-- Phần tính năng -->
    <div class="container">
      <div class="feature-box">Feature 1</div>
      <div class="feature-box">Feature 2</div>
      <div class="feature-box">Feature 3</div>
    </div>

    <!-- Footer -->
    <div style="background-color: black; color: white; padding: 10px">
      <p style="text-align: center">Contact us: email@example.com</p>
    </div>
  </body>
</html>
